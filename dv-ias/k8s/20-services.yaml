# DV-IAS 应用层：网关 + 7服务 + Web（命名空间 szxc-prod）
# 镜像统一来自集群私有仓库 10.167.2.175:30500/szxc/*
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: gw, namespace: szxc-prod, labels: {app: gw}}
spec:
  replicas: 2
  selector: {matchLabels: {app: gw}}
  template:
    metadata: {labels: {app: gw}}
    spec:
      priorityClassName: szxc-critical
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm: {topologyKey: kubernetes.io/hostname, labelSelector: {matchLabels: {app: gw}}}
      containers:
      - name: gw
        image: 10.167.2.175:30500/szxc/gw:1.5
        ports: [{containerPort: 8080}, {containerPort: 8081}]
        env:
        - {name: JWT_SECRET, valueFrom: {secretKeyRef: {name: szxc-secrets, key: JWT_SECRET}}}
        - {name: INTROSPECTION, value: "true"}
        resources: {requests: {cpu: 200m, memory: 256Mi}, limits: {cpu: "2", memory: 1Gi}}
        readinessProbe: {httpGet: {path: /healthz, port: 8081}, periodSeconds: 5}
        livenessProbe: {httpGet: {path: /healthz, port: 8081}, initialDelaySeconds: 20, periodSeconds: 10}
---
apiVersion: v1
kind: Service
metadata: {name: gw-svc, namespace: szxc-prod, labels: {app: gw-svc, metrics: "true"}}
spec:
  type: NodePort
  selector: {app: gw}
  ports: [{name: http-metrics, port: 8080, targetPort: 8080, nodePort: 30085}]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: gw-hpa, namespace: szxc-prod}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: gw}
  minReplicas: 2
  maxReplicas: 6
  metrics:
  - type: Resource
    resource: {name: cpu, target: {type: Utilization, averageUtilization: 60}}
---
